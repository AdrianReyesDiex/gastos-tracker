<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Gastos</title>
<!-- Apply the saved light/dark choice before first paint so the background doesn't flash -->
<script>try {
  const t = JSON.parse(localStorage.getItem('gastos-tema')), sticker = t.color === 'sticker', html = document.documentElement;
  html.style.colorScheme = sticker ? 'light' : t.scheme;
  if (sticker) html.dataset.style = 'sticker';
} catch {}</script>
<style>
  /* Every color is light-dark(light, dark): `color-scheme` on <html> picks the side (needs iOS 17.5+).
     --brand, --accent and --glow come from the chosen theme in app.js. */
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f5f5fa, #0c0c12); --card: light-dark(#fff, #1a1a22); --text: light-dark(#111118, #f4f4f8); --muted: light-dark(#8a8a98, #8e8e9c);
    --sep: light-dark(rgba(60, 60, 67, .12), rgba(255, 255, 255, .08)); --fill: light-dark(rgba(120, 120, 140, .12), rgba(255, 255, 255, .08));
    --ok: light-dark(#34c759, #30d158); --danger: light-dark(#ff3b30, #ff453a); --seg: light-dark(#fff, #3a3a48);
    --glass: light-dark(rgba(255, 255, 255, .75), rgba(30, 30, 40, .72));
    --shadow: 0 1px 2px light-dark(rgba(20, 20, 50, .04), transparent), 0 6px 20px light-dark(rgba(20, 20, 50, .07), transparent);
    /* Chart categorical slots, validated as an adjacent (and donut wrap-around) set in both modes with the dataviz validator */
    --cat-1: light-dark(#2a78d6, #3987e5); --cat-2: light-dark(#eb6834, #d95926); --cat-3: light-dark(#1baf7a, #199e70);
    --cat-4: light-dark(#eda100, #c98500); --cat-5: light-dark(#e87ba4, #d55181); --cat-6: #008300;
    --cat-7: light-dark(#6250d6, #9085e9); --cat-8: light-dark(#e34948, #e66767);
    --round: ui-rounded, -apple-system, system-ui, sans-serif;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; margin: 0; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; } /* no visible scrollbars, the page still scrolls */
  html { touch-action: pan-x pan-y; } /* scrolling only: no pinch or double-tap zoom */
  [hidden] { display: none !important; }
  body { min-height: 100vh; font: 17px/1.35 -apple-system, system-ui, sans-serif; color: var(--text); -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 45% at 50% 0, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%) no-repeat, var(--bg); }
  main { max-width: 560px; margin: auto; overflow-x: clip; /* slide-in animations never widen the page */ padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px); }
  h1 { font: 700 32px/1.15 var(--round); letter-spacing: -.01em; margin: 4px 0 18px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 4px 10px; }
  button, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
  button, .tile { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; transition: transform .15s; }
  button:active, .tile:active { transform: scale(.96); }
  input:focus { outline: none; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .note { color: var(--muted); font-size: 13px; margin: 14px 4px; }
  .empty { margin-top: 48px; text-align: center; color: var(--muted); }
  .empty .i { display: block; width: 44px; height: 44px; margin: 0 auto 10px; stroke-width: 1.5; }
  /* Lucide icons (icons.js): inline ones follow the text size */
  .i { flex: none; width: 1.15em; height: 1.15em; vertical-align: -.2em; }

  /* Buttons & inputs */
  .primary { display: block; width: 100%; margin-top: 28px; padding: 16px; border-radius: 18px; background: var(--brand); color: #fff; font-weight: 600; box-shadow: 0 10px 24px var(--glow); }
  .field { display: block; width: 100%; padding: 15px 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); border: 2px solid transparent; transition: border-color .2s; }
  .field:focus { border-color: var(--c, var(--accent)); }
  .field + .field, .choices + .field { margin-top: 12px; }
  .icon-btn { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--fill); }
  .icon-btn svg { width: 20px; height: 20px; }
  .counter { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 10px 16px; margin-bottom: 12px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); }
  .stepper { display: flex; align-items: center; border-radius: 12px; background: var(--fill); }
  .stepper button { width: 44px; height: 36px; font-size: 22px; color: var(--accent); }
  .stepper b { min-width: 22px; text-align: center; font-family: var(--round); }

  /* Welcome & home */
  .welcome, .profile { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin-bottom: 8px; }
  .welcome h1 { margin: 10px 0 0; }
  .avatar { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%; background: var(--brand); color: #fff; font: 700 38px var(--round); box-shadow: 0 10px 30px var(--glow); }
  .date { font-size: 15px; margin-top: 4px; }
  .hero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; width: 100%; aspect-ratio: 1.7; padding: 24px; border-radius: 32px; background: var(--brand); color: #fff; text-align: left; box-shadow: 0 20px 40px var(--glow); }
  .hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .12); }
  .hero::before { width: 280px; height: 280px; top: -90px; right: -70px; }
  .hero::after { width: 150px; height: 150px; top: 70px; right: 100px; }
  .hero .plus { position: absolute; top: 24px; left: 24px; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: rgba(255, 255, 255, .22); animation: pulse 2.6s ease-in-out infinite; }
  .hero .plus svg { width: 34px; height: 34px; }
  .hero b { position: relative; font: 700 28px var(--round); }
  .hero small { position: relative; font-size: 15px; opacity: .85; margin-top: 4px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); } 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .35); } }

  /* Wizard */
  .wizard-head { display: flex; align-items: center; gap: 14px; min-height: 44px; margin-bottom: 8px; }
  .progress { flex: 1; display: flex; gap: 6px; }
  .progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--fill); transform-origin: left; }
  .progress i.on { background: var(--brand); }
  .amount { display: flex; justify-content: center; align-items: baseline; gap: 4px; margin: 48px 0 8px; font: 700 64px var(--round); }
  .amount span { font-size: 40px; color: var(--muted); }
  .amount input { width: 5ch; font: inherit; caret-color: var(--accent); }
  @supports (field-sizing: content) { .amount input { width: auto; min-width: 1ch; max-width: 80vw; field-sizing: content; } }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choice { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 20px; border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow); text-align: left; font-weight: 600; transition: transform .15s, border-color .2s, background-color .2s; }
  .choice.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--card)); }
  .choice.sel::after { content: '✓'; position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; font-size: 13px; }
  .choice.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .bank-card.near small { align-self: flex-start; padding: 1px 6px; border-radius: 6px; background: #ff9f0a; color: #000; opacity: 1; }
  .near-note { color: light-dark(#b45309, #fbbf24); }
  .tile-flag { display: flex; align-items: flex-start; gap: 4px; margin-top: 6px; font-size: 12px; font-weight: 600; line-height: 1.25; }
  .tile-flag .i { width: 14px; height: 14px; margin-top: 1px; }
  .tile-flag.warn { color: light-dark(#b45309, #fbbf24); }
  .tile-flag.over { color: light-dark(#d70015, #ff6961); }
  .choice:not(.sel):has(.tile-flag.over) { border-color: color-mix(in srgb, light-dark(#d70015, #ff6961) 55%, transparent); }
  .three .choice { align-items: center; padding: 16px 6px; text-align: center; font-size: 15px; }
  .ico { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 14px; background: color-mix(in srgb, var(--c) 18%, transparent); color: color-mix(in srgb, var(--c) 70%, var(--text)); }
  .ico .i { width: 24px; height: 24px; }

  /* Bank cards */
  .bank-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .bank-card { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; width: 100%; aspect-ratio: 1.586; padding: 12px 14px; border-radius: 16px; background: var(--g); color: var(--ink, #fff); text-align: left; box-shadow: 0 6px 16px rgba(0, 0, 0, .15); }
  .bank-card::before { content: ''; position: absolute; width: 140%; aspect-ratio: 1; top: -70%; right: -75%; border-radius: 50%; background: rgba(255, 255, 255, .13); }
  .bank-card > span { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .bank-card small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
  .bank-card b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bank-card .chip { width: 30px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #f7dc8b, #c9a14a); }
  .bank-card.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
  .bank-card:disabled { opacity: .4; filter: grayscale(.7); cursor: not-allowed; }
  .bank-card.sel::after { content: '✓'; position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #111; font-size: 13px; font-weight: 700; }
  .card-wrap { position: relative; }
  .card-del { position: absolute; top: -8px; right: -8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--danger); color: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
  .card-del svg { width: 14px; height: 14px; }
  .add-card { align-self: start; aspect-ratio: 1.586; border-radius: 16px; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); font-weight: 600; }

  /* Filters & lists */
  .segmented { display: flex; padding: 3px; margin-bottom: 10px; border-radius: 12px; background: var(--fill); }
  .segmented :is(button, label) { flex: 1; padding: 7px 2px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; }
  .segmented :is(.sel, label:has(:checked)) { background: var(--seg); color: var(--text); box-shadow: 0 2px 6px rgba(0, 0, 0, .1); }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; } /* the label is the button */
  .segmented label:has(:focus-visible) { outline: 2px solid var(--accent); }
  .period-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; font: 600 17px var(--round); }
  .period-nav button { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); color: var(--accent); display: grid; place-items: center; }
  .period-nav .i { width: 20px; height: 20px; }
  .period-nav button:disabled { opacity: .35; }
  .summary { display: flex; padding: 20px; border-radius: 24px; background: var(--brand); color: #fff; box-shadow: 0 12px 28px var(--glow); }
  .summary > div { flex: 1; }
  .summary small { display: block; font-size: 13px; opacity: .85; }
  .summary b { font: 700 28px var(--round); }
  .tx-list, .panel { border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
  .tx-list { overflow: hidden; }
  .tx { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; }
  .tx + .tx { border-top: .5px solid var(--sep); }
  .tx:active { transform: none; background: var(--fill); }
  .tx-main { flex: 1; min-width: 0; }
  .tx-main b { display: block; font-weight: 600; }
  .tx-main small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-amount { font: 600 17px var(--round); white-space: nowrap; }
  .tx-main .tx-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .pay-tag { display: inline-flex; align-items: center; gap: 5px; min-width: 0; padding: 2px 8px 2px 4px; border-radius: 8px; background: var(--fill); color: var(--text); font-size: 12px; font-weight: 600; }
  .pay-tag > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pay-tag small { color: var(--muted); font-weight: 500; }
  .pay-tag.cash { padding-left: 6px; background: color-mix(in srgb, var(--ok) 18%, transparent); }
  .pay-tag.income { padding-left: 6px; background: color-mix(in srgb, var(--ok) 18%, transparent); }
  .pay-arrow { color: var(--muted); }
  .mini-card { position: relative; flex: none; width: 24px; height: 16px; border-radius: 4px; background: var(--g); box-shadow: inset 0 0 0 .5px light-dark(rgba(0, 0, 0, .2), rgba(255, 255, 255, .45)); }
  .mini-card::after { content: ''; position: absolute; top: 5px; left: 3px; width: 6px; height: 5px; border-radius: 1.5px; background: #f0cf72; }

  /* Stats */
  .panel { padding: 16px 18px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .kpis > div { padding: 14px 16px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); min-width: 0; }
  .kpis small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpis b { font: 700 22px var(--round); }
  .cols-caption { min-height: 20px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--sep); }
  .cols button { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; }
  .cols button:active { transform: none; }
  .cols i { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); transform-origin: bottom; transition: opacity .2s; }
  .cols.picked button:not(.sel) i { opacity: .3; }
  .ticks { display: flex; gap: 2px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .ticks span { flex: 1; min-width: 0; display: flex; justify-content: center; white-space: nowrap; }
  .donut { position: relative; width: 170px; margin: 4px auto 12px; }
  .donut svg { display: block; transform: rotate(-90deg); fill: none; stroke-width: 14; }
  .donut div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .donut small { color: var(--muted); font-size: 12px; }
  .donut b { font: 700 18px var(--round); }
  .legend-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .legend-row + .legend-row { border-top: .5px solid var(--sep); }
  .legend-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-row small { width: 3em; text-align: right; color: var(--muted); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .bar-row { padding: 8px 0; }
  .bar-label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .bar-label small { color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; border-radius: 4px; background: var(--fill); }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transform-origin: left; }

  /* Profile */
  .name-input { width: 100%; padding: 4px; border-radius: 10px; text-align: center; font: 700 26px var(--round); }
  .name-input:focus { background: var(--fill); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
  .tile .i { width: 28px; height: 28px; color: var(--accent); }
  .link { color: var(--accent); font-weight: 600; }
  .note .link { margin-left: 4px; }
  .warn { color: var(--danger); }
  .icon-btn.danger { color: var(--danger); }
  .choice small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .setup-card + .setup-card { margin-top: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .meter { position: relative; display: block; height: 6px; margin-top: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .card-meta { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
  .debt-list { border-radius: 20px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
  .debt-list > * + * { border-top: .5px solid var(--sep); }
  .debt-row { display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 16px; }
  .debt-main { flex: 1; min-width: 0; text-align: left; }
  .debt-main b { display: block; font-weight: 600; }
  .debt-main small { color: var(--muted); font-size: 13px; }
  .add-debt { width: 100%; padding: 14px; color: var(--accent); font-weight: 600; }
  .success-line { font-weight: 600; color: var(--text) !important; }
  .goal { padding: 14px 12px 8px 16px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
  .goal + .goal { margin-top: 12px; }
  .goal-main { display: block; width: 100%; text-align: left; }
  .goal-head { display: flex; align-items: center; gap: 12px; }
  .goal-head b { display: block; font-weight: 600; }
  .goal-head small, .goal-main > small { color: var(--muted); font-size: 13px; }
  .goal-daily { display: block; margin: 12px 0 2px; font-size: 15px; }
  .goal-daily b { font: 700 22px var(--round); }
  .goal-main > small { display: block; margin-top: 6px; }
  .goal-actions { display: flex; align-items: center; margin-top: 4px; }
  .goal-actions .icon-btn { margin-left: auto; }
  .income-btn { display: block; width: 100%; margin-top: 12px; padding: 15px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); color: var(--accent); font-weight: 600; }
  .month { display: flex; gap: 8px; }
  .month > div { flex: 1; min-width: 0; }
  .month small { display: block; font-size: 13px; color: var(--muted); }
  .month b { font: 700 19px var(--round); white-space: nowrap; font-variant-numeric: tabular-nums; } /* digits keep their width while counting */
  .head-row { display: flex; justify-content: space-between; align-items: center; }
  .head-row .link { font-size: 15px; text-transform: none; letter-spacing: 0; }
  /* Lock screen: over everything (confirmations and confetti included) until the PIN or Face ID is right */
  .lock { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); background: var(--bg); }
  .lock-title { font: 600 20px var(--round); }
  .pin-dots { display: flex; gap: 18px; margin-bottom: 12px; }
  .pin-dots i { width: 14px; height: 14px; border: 2px solid var(--text); border-radius: 50%; transition: background-color .15s; }
  .pin-dots i.on { background: var(--text); }
  .keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 22px; }
  .keypad button { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); font: 600 30px var(--round); }
  .keypad .i { width: 28px; height: 28px; }
  .add-debt.danger { color: var(--danger); }

  /* Category editor: icon and color pickers (radio grids), the list in Perfil */
  .sheet-label { margin: 16px 4px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .pick-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .pick-grid.colors { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .sheet .pick-grid label { display: grid; place-items: center; margin: 0; aspect-ratio: 1; border: 2px solid transparent; border-radius: 12px; background: var(--card); color: var(--text); cursor: pointer; }
  .pick-grid label:has(:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .pick-grid label:has(:focus-visible) { outline: 2px solid var(--accent); }
  .pick-grid input { position: absolute; opacity: 0; pointer-events: none; }
  .pick-grid .i { width: 22px; height: 22px; }
  .swatch { width: 70%; aspect-ratio: 1; border-radius: 50%; }
  .cat-preview { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .cat-row { display: flex; align-items: center; gap: 12px; }
  .cat-row .ico { width: 36px; height: 36px; border-radius: 11px; }
  .cat-row small { display: block; }
  .cat-row:disabled { opacity: 1; cursor: default; }
  .cat-row:disabled:active { transform: none; }

  /* Quick expenses on Home: a row that scrolls sideways when there are many */
  .quick-row { display: flex; gap: 10px; margin: 0 -16px; padding: 2px 16px 8px; overflow-x: auto; scroll-snap-type: x proximity; }
  .quick { flex: none; display: flex; align-items: center; gap: 10px; max-width: 70%; padding: 8px 14px 8px 8px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); text-align: left; scroll-snap-align: start; }
  .quick .ico { width: 36px; height: 36px; border-radius: 11px; }
  .quick .ico .i { width: 20px; height: 20px; }
  .quick > span:last-child { min-width: 0; }
  .quick b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quick small { display: block; font-size: 13px; color: var(--muted); }
  /* Historial search; while searching, the period controls hide (it looks through every period) */
  .search { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 14px; border-radius: 14px; background: var(--fill); color: var(--muted); }
  .search input { flex: 1; min-width: 0; padding: 11px 0; color: var(--text); -webkit-appearance: none; appearance: none; }
  .filters.searching > :not(:last-child) { display: none; }
  .tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* Comparison with the previous period: more spending is the warning direction; arrow + words, not color alone */
  .compare-total { margin-bottom: 6px; }
  .legend-row .delta { width: auto; margin-left: auto; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .delta.up { color: var(--danger); }
  .delta.down { color: light-dark(#1f8a3b, #30d158); }

  /* Reminders on Home and "Se repite cada mes" in the wizard */
  .reminders { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; } /* long names shrink instead of widening the page */
  .reminder { display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 12px; border: 2px solid transparent; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
  .reminder .ico { width: 40px; height: 40px; border-radius: 12px; }
  .reminder .mini-card { width: 26px; height: 18px; }
  .reminder-text { flex: 1; min-width: 0; }
  .reminder-text b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reminder-text small { display: block; font-size: 13px; color: var(--muted); }
  .reminder-go { flex: none; padding: 8px 14px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 600; }
  .reminder .icon-btn { flex: none; color: var(--muted); }
  .reminder.urgent { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .reminder.urgent small { color: var(--danger); }
  .repeat { display: flex; align-items: center; gap: 14px; margin-top: 24px; padding: 14px 16px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); cursor: pointer; }
  .repeat input { flex: none; width: 22px; height: 22px; accent-color: var(--accent); }
  .repeat b { display: block; font-weight: 600; }
  .repeat small { display: block; font-size: 13px; color: var(--muted); }

  /* Budgets: a summary with a ring, then a tile per category in its chart color (--c) */
  .budget-sum { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .ring { position: relative; flex: none; width: 92px; }
  .ring svg { display: block; transform: rotate(-90deg); fill: none; stroke: var(--fill); stroke-width: 10; stroke-linecap: round; }
  .ring .val { stroke: var(--accent); }
  .ring b { position: absolute; inset: 0; display: grid; place-content: center; font: 700 20px var(--round); }
  .budget-sum-main { min-width: 0; }
  .budget-sum-main small { display: block; font-size: 13px; color: var(--muted); }
  .budget-sum-main > b { display: block; font: 700 28px/1.15 var(--round); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .budget-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 4px 10px; border-radius: 10px; background: var(--fill); font-size: 13px; font-weight: 600; }
  .budget-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .budget { display: flex; flex-direction: column; min-width: 0; padding: 14px; border: 2px solid transparent; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); text-align: left; }
  .budget-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .budget .ico { width: 36px; height: 36px; border-radius: 12px; }
  .budget .ico .i { width: 20px; height: 20px; }
  .budget-pct { padding: 2px 8px; border-radius: 8px; background: var(--fill); color: var(--muted); font-size: 12px; font-weight: 700; }
  .budget > b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .budget > small { font-size: 12px; color: var(--muted); }
  .budget-left { font: 700 19px var(--round); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .budget .meter { height: 8px; margin: 8px 0 6px; border-radius: 4px; }
  .budget .meter i { background: var(--c); transform-origin: left; }
  :is(.budget, .budget-sum).warn { color: var(--text); } /* only the bar and the chip change, not the global .warn red */
  .budget.warn .meter i { background: #ff9f0a; }
  .budget-sum.warn .val { stroke: #ff9f0a; }
  .budget.warn .budget-pct { background: rgba(255, 159, 10, .18); color: light-dark(#b25000, #ffb340); }
  .budget.over { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .budget.over .meter i { background: var(--danger); }
  .budget-sum.over .val { stroke: var(--danger); }
  .budget.over .budget-pct { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  :is(.budget.over .budget-left, .budget-sum.over .budget-sum-main > b) { color: var(--danger); }
  .budget-empty { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border: 2px dashed var(--sep); border-radius: 20px; background: var(--card); text-align: left; }
  .budget-empty b { display: block; font-weight: 600; }
  .budget-empty small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .bar i.income-bar { background: var(--ok); }
  .date-pick { display: flex; align-items: center; gap: 10px; width: fit-content; margin: 20px auto 0; padding: 6px 6px 6px 14px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
  .date-pick input { padding: 6px 10px; border-radius: 10px; background: var(--fill); color: var(--accent); font-weight: 600; }
  .sheet-delete { display: block; width: 100%; margin-top: 14px; padding: 10px; color: var(--danger); font-weight: 600; }
  .sheet-preview { margin: 12px 4px 0; font-size: 15px; }
  .sheet-preview:empty { display: none; }
  .sheet input[type=date] { min-height: 54px; text-align: left; -webkit-appearance: none; appearance: none; }
  .sheet input[type=date]::-webkit-date-and-time-value { text-align: left; }

  /* Edit form: a card near the top so the iPhone keyboard never covers it */
  .sheet { width: calc(100% - 32px); max-width: 480px; margin: calc(env(safe-area-inset-top) + 48px) auto auto; padding: 20px 16px 16px; border: 0; border-radius: 28px; background: var(--bg); color: var(--text); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  .sheet[open] { animation: sheet-in .35s var(--spring); }
  .sheet::backdrop { background: rgba(0, 0, 0, .35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .sheet h3 { margin-bottom: 4px; text-align: center; font: 700 22px var(--round); }
  .sheet label { display: block; margin: 12px 4px 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .sheet .segmented { margin: 16px 0 4px; }
  .sheet .segmented label { margin: 0; font-size: 14px; }
  .sheet label .field { margin-top: 6px; font-size: 17px; font-weight: 400; color: var(--text); }
  .sheet-error { min-height: 18px; margin: 10px 4px 0; font-size: 14px; color: var(--danger); }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .sheet-actions button { margin-top: 0; padding: 15px; border-radius: 16px; font-weight: 600; }
  .secondary { background: var(--fill); }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(-24px) scale(.96); } }

  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .theme { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 8px; border-radius: 18px; border: 2px solid transparent; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 600; }
  .theme span { width: 100%; aspect-ratio: 2; border-radius: 12px; }
  .theme.sel { border-color: var(--accent); }

  /* Floating tab bar like iOS 26 */
  nav { position: fixed; left: 16px; right: 16px; bottom: max(12px, calc(env(safe-area-inset-bottom) - 12px)); z-index: 10; max-width: 480px; margin: auto; display: flex; padding: 4px; border-radius: 32px; background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: .5px solid var(--sep); box-shadow: 0 8px 32px rgba(0, 0, 0, .15); }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; border-radius: 28px; font-size: 10px; font-weight: 600; color: var(--muted); transition: transform .15s, color .2s, background-color .2s; }
  nav button.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  nav svg { width: 26px; height: 26px; }

  /* Notifications */
  .toast { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top) + 10px); left: 0; right: 0; width: fit-content; max-width: calc(100% - 32px); margin: auto; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 999px; background: #111; color: #fff; font-size: 15px; font-weight: 600; border: .5px solid rgba(255, 255, 255, .12); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
  .toast i { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); font-style: normal; }
  .toast i .i { width: 16px; height: 16px; stroke-width: 2.5; }
  .avatar .i { width: 40px; height: 40px; }
  .pay-tag .i { width: 14px; height: 14px; }
  .toast.error i { background: var(--danger); }
  .success { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); animation: fade .25s; }
  .success.out { animation: fade .3s reverse forwards; }
  .success .check { width: 110px; height: 110px; margin-bottom: 10px; fill: none; stroke: var(--ok); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; animation: pop .5s var(--spring); }
  .success .check circle { stroke-dasharray: 151; stroke-dashoffset: 151; animation: draw .5s .1s forwards; }
  .success .check path { stroke-dasharray: 32; stroke-dashoffset: 32; animation: draw .3s .5s forwards; }
  .success > b { font: 700 26px var(--round); } /* only the title and text, not inside the art */
  .success > span { color: var(--muted); }
  .coin { position: fixed; z-index: 45; width: 18px; height: 18px; margin: -9px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 35%, #fff4b8, #f7c948 45%, #c99a06); box-shadow: inset 0 0 0 1.5px #a87d00; }
  .coin::after { content: "$"; display: block; font: 800 11px/18px system-ui, sans-serif; text-align: center; color: #7a5a00; }
  .float-amount { position: fixed; z-index: 45; pointer-events: none; white-space: nowrap; font: 700 22px var(--round); color: light-dark(#1f8a47, #30d158); }
  .sparkle { position: fixed; z-index: 45; width: 12px; height: 12px; margin: -6px; pointer-events: none; background: var(--spark, #ffc800);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  /* A goal milestone: a light sweeps across the bar twice and it glows */
  .meter.shine { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  .meter.shine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent); transform: translateX(-100%); animation: sweep .9s ease-in-out 2; }
  @keyframes sweep { to { transform: translateX(100%); } }
  /* Achievements */
  .success .medal { display: grid; place-items: center; width: 120px; height: 120px; margin-bottom: 12px; border-radius: 50%; color: #6b4700;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #f7c948 45%, #c99a06); box-shadow: 0 12px 30px rgba(201, 154, 6, .45), inset 0 0 0 4px rgba(255, 255, 255, .4);
    animation: medal-drop 1.2s cubic-bezier(.3, 1.35, .5, 1) both; }
  .success .medal .i { width: 62px; height: 62px; }
  @keyframes medal-drop { from { transform: translateY(-70vh) rotate(-540deg); } } /* falls spinning, bounces to rest */
  .success .big-pct { margin-bottom: 6px; font: 800 72px var(--round); font-variant-numeric: tabular-nums; color: light-dark(#a87d00, #f7c948); }
  .paid-card { position: relative; width: 230px; margin-bottom: 16px; perspective: 900px; }
  .paid-card .bank-card { animation: card-flip .9s ease-out both; }
  @keyframes card-flip { from { transform: rotateY(-200deg) scale(.7); } }
  .stamp { position: absolute; top: 50%; left: 50%; padding: 4px 14px; border: 4px solid #e0115f; border-radius: 10px; background: rgba(255, 255, 255, .88);
    color: #e0115f; font: 900 30px var(--round); letter-spacing: .1em; transform: translate(-50%, -50%) rotate(-14deg);
    animation: stamp .4s .9s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes stamp { from { transform: translate(-50%, -50%) rotate(-14deg) scale(3); opacity: 0; } } /* slammed on like a rubber stamp */
  .success .flame { display: grid; place-items: center; transform-origin: 50% 90%; animation: flame-grow .9s cubic-bezier(.3, 1.6, .5, 1) both, flicker 1.4s .9s ease-in-out infinite alternate; }
  .success .flame .i { width: 96px; height: 96px; fill: #ffb000; stroke: #ff5a00; stroke-width: 1.5; }
  @keyframes flame-grow { from { transform: scale(0); } }
  @keyframes flicker { to { transform: scale(1.06, .95) rotate(2deg); } }
  .success .streak-num { margin-bottom: 4px; font: 800 44px var(--round); font-variant-numeric: tabular-nums; }
  /* Deleting: the trash can above the tab bar and the copy that flies into it */
  .trash-bin { position: fixed; z-index: 46; left: 0; right: 0; bottom: calc(max(12px, env(safe-area-inset-bottom) - 12px) + 84px); width: 64px; height: 64px; margin: auto;
    border-radius: 50%; background: var(--card); color: var(--danger); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); pointer-events: none; }
  .trash-bin svg { position: absolute; inset: 0; width: 32px; height: 32px; margin: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bin-lid { transform-origin: 12.5% 25%; } /* hinge at the lid's left end (3,6 of 24) */
  .trash-ghost { position: fixed; z-index: 45; margin: 0; border-radius: 16px; pointer-events: none; transform-origin: center; }
  [data-style=sticker] .trash-bin { border: var(--line); box-shadow: var(--shadow); }
  .confetti { position: fixed; inset: 0; z-index: 45; width: 100%; height: 100%; pointer-events: none; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  /* "Sticker" theme: cream paper, black outlines on everything, flat neon fills and a hard offset
     shadow instead of a blur, like stickers pasted on a notebook. Black ink on every neon fill. */
  :root[data-style=sticker] {
    --bg: #f2f2f2; --card: #fff; --text: #000; --muted: #6e6e6e; --sep: #000; --fill: #e7e3bf; --seg: #adff02; --glass: #fff;
    --danger: #d70015; --shadow: 3px 3px 0 #000; --line: 1.5px solid #000;
    --pink: #fa00ff; --cyan: #02bbff; --lime: #adff02;
    /* iOS ships Helvetica Neue Condensed Black, so no web font (works offline) */
    --round: "HelveticaNeue-CondensedBlack", "AvenirNextCondensed-Heavy", Impact, system-ui, sans-serif;
  }
  [data-style=sticker] body { background: var(--bg); }
  [data-style=sticker] h1 { font-size: 38px; line-height: .95; text-transform: uppercase; letter-spacing: -.01em; }
  [data-style=sticker] :is(.field, .choice, .tile, .theme, .counter, .tx-list, .panel, .kpis > div, .goal, .debt-list, .summary,
    .hero, .primary, .secondary, .segmented, .toast, .bank-card, .icon-btn, .sheet, .ico, .period-nav button, .avatar, .card-del,
    .income-btn, .date-pick, .budget, .budget-empty, .reminder, .reminder-go, .repeat, .quick, .search, .keypad button) { border: var(--line); }
  [data-style=sticker] .income-btn { background: var(--cyan); color: #000; }
  [data-style=sticker] .pay-tag { border: 1px solid #000; }
  [data-style=sticker] .pay-tag.cash, [data-style=sticker] .pay-tag.income { background: var(--lime); }
  [data-style=sticker] .mini-card { box-shadow: none; outline: 1px solid #000; }
  [data-style=sticker] :is(.summary, .hero, .primary, .avatar) { color: #000; }
  [data-style=sticker] .summary { background: var(--cyan); box-shadow: var(--shadow); }
  [data-style=sticker] .hero { background: var(--pink); box-shadow: 5px 5px 0 #000; }
  [data-style=sticker] .hero::before { background: var(--cyan); border: var(--line); }
  [data-style=sticker] .hero::after { background: var(--lime); border: var(--line); }
  [data-style=sticker] .hero .plus { background: #fff; border: var(--line); transform: rotate(-8deg); animation: none; }
  [data-style=sticker] .primary { background: var(--lime); box-shadow: var(--shadow); }
  [data-style=sticker] .avatar { background: var(--lime); box-shadow: var(--shadow); }
  [data-style=sticker] .bank-card, [data-style=sticker] .sheet { box-shadow: var(--shadow); }
  [data-style=sticker] .add-card { border: 1.5px dashed #000; color: #000; }
  [data-style=sticker] :is(.choice, .theme).sel { background: var(--lime); border-color: #000; }
  [data-style=sticker] .choice.sel::after { background: #000; color: var(--lime); }
  [data-style=sticker] .segmented :is(.sel, label:has(:checked)) { border: var(--line); box-shadow: none; }
  [data-style=sticker] nav { border: var(--line); box-shadow: var(--shadow); -webkit-backdrop-filter: none; backdrop-filter: none; }
  [data-style=sticker] nav button.active { background: var(--lime); color: #000; box-shadow: inset 0 0 0 1.5px #000; }
  [data-style=sticker] .toast { background: #fff; color: #000; box-shadow: var(--shadow); }
  [data-style=sticker] .toast i { border: var(--line); color: #000; }
  /* Pressing a sticker pushes it into its shadow */
  [data-style=sticker] :is(.primary, .choice, .tile, .theme, .hero, .bank-card):active { transform: translate(3px, 3px); box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .success .check circle, .success .check path { stroke-dashoffset: 0; }
  }
</style>
